# Default (no profile): grobid + redis + gateway + worker + web. Retrieval and the LLM come from wherever
# .env points (the shared cloud services, see README). Nothing here needs a GPU.
#   docker compose up -d --build                      then open http://localhost:5173
#
# Everything on one machine with an NVIDIA GPU:
#   docker compose --profile gpu up -d --build        adds vllm, colbert
#   docker compose --profile vision up -d colpali     adds figure/page retrieval (~4 GB model)
#
# Only backend/cli.py stays on the host: it is the interactive REPL and spawns the
# DuckDuckGo MCP server via uvx. It reaches every service on localhost.
#
# Ports are published on 127.0.0.1 only, because none of these services checks who is
# calling: on café or campus Wi-Fi, 0.0.0.0 would open them to everyone on the network.
# Containers reach each other by service name, so this changes nothing between them. To share
# the stack with teammates over Tailscale, set BIND_ADDRESS to this machine's Tailscale IP.
services:
  vllm:
    profiles: [gpu]
    image: vllm/vllm-openai:v0.26.0
    # 4B is what a 16 GB card can spare once ColBERT and ColQwen2 have taken theirs.
    # See .env.example for the model/quantization/memory trade-offs.
    command:
      - ${VLLM_HF_MODEL:-Qwen/Qwen3.5-4B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - ${VLLM_SERVED_NAME:-qwen}
      - --max-model-len
      - "${VLLM_MAX_LEN:-8192}"
      # A share of the WHOLE card, not of what is free. 0.6 fits Qwen beside ColBERT alone;
      # with `--profile vision` raise it (VLLM_GPU_UTIL=0.88) and start colbert/colpali first.
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.6}"
      - --enforce-eager # no CUDA graphs: gives back ~1.5 GiB
      - --max-num-seqs
      - "2"
      - --quantization
      - ${VLLM_QUANT:-fp8}
      - --kv-cache-dtype
      - fp8
      - --generation-config
      - vllm
      - --language-model-only
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --enable-prefix-caching
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-} # optional: only lifts the Hub's anonymous rate limit
    gpus: all
    restart: unless-stopped

  grobid:
    environment:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
    image: lfoppiano/grobid:0.8.2
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8070:8070"
    restart: unless-stopped

  colbert:
    profiles: [gpu]
    build:
      context: ./services/colbert
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu130
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8893:8893"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./data/papers:/app/data/papers # so add("data/papers/x.pdf") resolves in both worlds
      - vectors:/data/vectors # per-paper safetensors files, shared with colpali
    environment:
      # A gs://bucket/prefix moves this to the cloud; unset, it writes under the volume above.
      VECTOR_STORE: /data/vectors
      HF_TOKEN: ${HF_TOKEN:-}
    gpus: all
    restart: unless-stopped

  # Vision retrieval over figures and rendered pages, ColQwen2 by default. Opt-in: it
  # downloads a ~4 GB model, so start it deliberately:
  #   docker compose --profile vision up -d colpali
  colpali:
    profiles: [vision]
    build: ./services/colpali
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8894:8894"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./data/papers:/app/data/papers
      - vectors:/data/vectors # per-paper safetensors files, shared with colbert
    environment:
      VECTOR_STORE: /data/vectors
      COLPALI_MODEL: ${COLPALI_MODEL:-vidore/colqwen2-v1.0}
      HF_TOKEN: ${HF_TOKEN:-}
    gpus: all
    restart: unless-stopped

  gateway:
    build: ./backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment: &gateway-env
      # Set VLLM_URL in .env to point at a vLLM somewhere else — a remote GPU host, say —
      # and the local vllm container stops being used. VLLM_API_KEY is what that one wants.
      VLLM_URL: ${VLLM_URL:-http://vllm:8000/v1}
      VLLM_MODEL: ${VLLM_MODEL:-${VLLM_SERVED_NAME:-qwen}} # the id {VLLM_URL}/models lists
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      ADK_ROUTER_MODEL: ${ADK_ROUTER_MODEL:-} # chat routers (screen and role agents); empty = VLLM_MODEL
      ADK_AGENT_MODEL: ${ADK_AGENT_MODEL:-} # data_agent and the CLI specialists; empty = VLLM_MODEL
      # Same idea for the retrieval services and GROBID: set COLBERT_URL / COLPALI_URL /
      # GROBID_URL in .env to reach ones running elsewhere; unset, the compose containers are used.
      COLBERT_URL: ${COLBERT_URL:-http://colbert:8893}
      COLPALI_URL: ${COLPALI_URL:-http://colpali:8894} # optional; visual hints are skipped when it is not running
      GROBID_URL: ${GROBID_URL:-http://grobid:8070}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0} # the analysis queue and cross-process SSE (app/queue.py)
      SERVICE_AUTH: ${SERVICE_AUTH:-none} # none for compose, api-key for the team gateway
      SERVICE_API_KEY: ${SERVICE_API_KEY:-} # your own key for the team gateway (SERVICE_AUTH=api-key)
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-} # e.g. secrets/service-auth.json
      PAPERS_DIR: data/papers
      ANALYSES_DB: /app/data/db/analyses.db
      S2_API_KEY: ${S2_API_KEY:-} # without one, Semantic Scholar 429s most lookups
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-} # without one, OpenAlex shares a tiny per-IP budget
      SCOPUS_API_KEY: ${SCOPUS_API_KEY:-} # the labeler's Scopus search (app/labeling/scopus.py)
      LABELING_LEADS: ${LABELING_LEADS:-} # e-mails of the labeling leads (#867)
      TEAM_EMAILS: ${TEAM_EMAILS:-} # e-mails allowed to sign in; empty lets every account in
      CLAIM_LIMIT: ${CLAIM_LIMIT:-20}
      PARALLEL_SOURCES: ${PARALLEL_SOURCES:-3} # cited papers downloaded and indexed at the same time
      PARALLEL_CHECKS: ${PARALLEL_CHECKS:-3} # claims or draft citations judged at once, per worker
      PARALLEL_SOURCES_TOTAL: ${PARALLEL_SOURCES_TOTAL:-} # the same, across all runs; empty = PARALLEL_SOURCES
      PARALLEL_CHECKS_TOTAL: ${PARALLEL_CHECKS_TOTAL:-} # the same, across all runs; empty = PARALLEL_CHECKS
      LLM_PARALLEL_REQUESTS: ${LLM_PARALLEL_REQUESTS:-3} # LLM requests in flight per process
      LLM_INTERACTIVE_SLOTS: ${LLM_INTERACTIVE_SLOTS:-0} # of those, slots DSPy calls leave to the chat agents
      DOCLING_OCR: ${DOCLING_OCR:-auto} # auto: OCR only PDFs without a text layer
      VISUAL_EVIDENCE: ${VISUAL_EVIDENCE:-} # true: checks also search the cited paper's figures (#446)
      FIGURE_WAIT: ${FIGURE_WAIT:-} # empty: checks wait for the cited paper's figures; seconds: fast mode
      # Both set: analyses are stored in Supabase Postgres instead of SQLite (supabase/README.md).
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GATEHOUSE_SECRET: ${GATEHOUSE_SECRET:-} # the screen agent's MCP server at /mcp/ (docs/agent-tools.md)
      # Google Classroom OAuth is handled only by the gateway; the browser never sees these.
      TEACHER_GOOGLE_ENABLED: ${TEACHER_GOOGLE_ENABLED:-false}
      TEACHER_GOOGLE_CLIENT_ID: ${TEACHER_GOOGLE_CLIENT_ID:-}
      TEACHER_GOOGLE_CLIENT_SECRET: ${TEACHER_GOOGLE_CLIENT_SECRET:-}
      TEACHER_GOOGLE_REDIRECT_URI: ${TEACHER_GOOGLE_REDIRECT_URI:-}
      TEACHER_GOOGLE_SUCCESS_REDIRECT: ${TEACHER_GOOGLE_SUCCESS_REDIRECT:-}
      TEACHER_GOOGLE_ENCRYPTION_KEY: ${TEACHER_GOOGLE_ENCRYPTION_KEY:-}
      TEACHER_GOOGLE_SCOPES: ${TEACHER_GOOGLE_SCOPES:-}
      # A Postgres URL keeps the chat agents' sessions after a restart (app/sessions.py).
      SESSION_DB_URL: ${SESSION_DB_URL:-${DIRECT_URL:-}}
      # LLM traces (app/tracing.py). Empty: off. http://phoenix:6006 with --profile tracing.
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-} # only for Phoenix Cloud
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-secretsource}
    volumes:
      # Override with an absolute path when the compose project directory is a CI checkout
      # that gets wiped/reset between deploys (see .github/workflows/deploy-backend.yml):
      # papers the container writes as its own (non-host) user would otherwise leave files a
      # checkout's `git clean` can't remove, breaking every deploy after the first paper.
      - ${PAPERS_HOST_DIR:-./data/papers}:/app/data/papers # shared with the retrieval services
      - ./backend/secrets:/app/secrets:ro # identity-token credentials, see .env.example
      - analyses:/app/data/db # run history survives a rebuild
      - hf-cache:/root/.cache/huggingface # docling's layout and table models, downloaded once
    depends_on:
      - grobid # vllm / colbert are only dependencies under --profile gpu; .env decides
      - redis
    cap_add:
      - SYS_PTRACE # lets py-spy attach to pid 1 for live profiling (backend/README.md#profiling)
    restart: unless-stopped

  # Backs the analysis queue (app/queue.py) and cross-process SSE delivery (app/main.py's
  # Redis Pub/Sub subscriber). A named volume so the queue itself survives a restart, not
  # just the app data. No published port: only gateway/worker reach it, by service name.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Runs analyses and Author draft checks pulled off the queue (app/queue.py), one job at a
  # time in this process. Horizontally scalable: the number of workers is how many jobs run at once.
  #   docker compose up -d --scale worker=3
  worker:
    build:
      context: ./backend
      args:
        # "<2.4" on a CPU without SSE4.2 (ss-core); empty elsewhere. See backend/app/native.py.
        NUMPY_SPEC: ${WORKER_NUMPY_SPEC:-}
    command: python worker.py
    # Metrics (worker.py, WORKER_METRICS_PORT 9101) for a Prometheus on the host. A range, so
    # --scale worker=3 still starts: each replica takes the next free port, the first gets 9102.
    # Always local, like Qdrant. Not 9101: Gatehouse's RustFS console has it on the shared machine.
    ports:
      - "127.0.0.1:9102-9104:9101"
    environment: *gateway-env
    volumes:
      - ${PAPERS_HOST_DIR:-./data/papers}:/app/data/papers
      - ./backend/secrets:/app/secrets:ro
      - analyses:/app/data/db
      - hf-cache:/root/.cache/huggingface
    depends_on:
      - redis
      - grobid
    restart: unless-stopped

  # TLS in front of the gateway, for a frontend hosted on a different origin (e.g. Vercel) that
  # reaches the gateway directly rather than through the web container's same-origin nginx
  # proxy: browsers block a plain-http fetch from an https page (mixed content), so the gateway
  # needs its own https endpoint too.
  #   docker compose --profile tls up -d gateway-tls
  # Put a cert in ./deploy/tls-proxy/certs/ (fullchain.pem, privkey.pem) first — a self-signed
  # one is fine for an internal-only deployment; visitors click through the browser warning once.
  gateway-tls:
    profiles: [tls]
    image: nginx:alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8443:443"
    volumes:
      - ./deploy/tls-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls-proxy/certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
    restart: unless-stopped

  # ADK's dev UI for the chat agents (backend/adk_agents). Development only:
  #   docker compose --profile dev up -d adk-web        then open http://localhost:8001
  adk-web:
    profiles: [dev]
    build: ./backend
    command: adk web --host 0.0.0.0 --port 8001 adk_agents
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8001:8001"
    environment:
      <<: *gateway-env
      PYTHONPATH: /app # adk_agents/ imports the app package
    volumes:
      - ./data/papers:/app/data/papers
      - ./backend/secrets:/app/secrets:ro
      - hf-cache:/root/.cache/huggingface
    depends_on:
      - grobid

  # The agent tree over A2A, for callers that are agents rather than people:
  #   docker compose --profile a2a up -d a2a     then http://localhost:8002
  # Its own service rather than a route on the gateway, so agent traffic and the product
  # API scale and fail separately.
  a2a:
    profiles: [a2a]
    build: ./backend
    command: python -m uvicorn a2a_server:app --host 0.0.0.0 --port 8002
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8002:8002"
    environment:
      <<: *gateway-env
      # What the agent card advertises back to callers, not what the server binds.
      A2A_HOST: ${A2A_HOST:-localhost}
      A2A_PORT: "8002"
    volumes:
      - ./data/papers:/app/data/papers
      - analyses:/app/data/db # the gateway's SQLite analyses, for load_memory when Supabase is not set
      - ./backend/secrets:/app/secrets:ro
      - hf-cache:/root/.cache/huggingface
    depends_on:
      - grobid
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Both set: users sign in, and each sees only their own analyses (SCRUM-177).
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        # Vite reads this only while compiling the browser bundle.
        VITE_TEACHER_BACKEND: ${VITE_TEACHER_BACKEND:-mock}
        VITE_GATEHOUSE_URL: ${VITE_GATEHOUSE_URL:-}
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5173:80"
    depends_on:
      - gateway
    restart: unless-stopped

  # Arize Phoenix: every LLM call the gateway and the workers make, with prompt, answer, tokens
  # and time. The UI and the trace endpoint share :6006. Opt-in, and the gateway only sends
  # traces when PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006 is set in .env:
  #   docker compose --profile tracing up -d phoenix
  # Traces hold paper text and prompts, and the UI has no login: keep BIND_ADDRESS private.
  phoenix:
    profiles: [tracing]
    image: arizephoenix/phoenix:version-20.22.0
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data # its SQLite database
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped

  # ss-core (2 GB RAM, 1 vCPU) OOM-crashed with no warning: a container ate memory until the
  # kernel started killing processes and the box stopped answering SSH and the gateway alike.
  # Nothing showed memory climbing beforehand — this profile adds that visibility. Opt-in, since
  # three more containers isn't something a small box should run by default:
  #   docker compose --profile monitoring up -d       see deploy/monitoring/README.md
  cadvisor:
    profiles: [monitoring]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8085:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  # The host's own numbers (disk, memory, load), which cAdvisor does not report. Grafana's
  # disk alert reads these: deploy/monitoring/grafana/provisioning/alerting/disk.yml.
  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:latest
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9090:9090"
    depends_on:
      - cadvisor
      - node-exporter
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:latest
    environment:
      # Only applies when grafana-data is empty; change it later in Grafana itself.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # The Analyses (Postgres) datasource's connection — see
      # deploy/monitoring/grafana/provisioning/datasources/analyses-postgres.yml. Empty
      # leaves that datasource unable to connect, which is fine when nobody has provisioned
      # grafana_ro yet.
      GRAFANA_DB_HOST: ${GRAFANA_DB_HOST:-}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      # Where the alerts in deploy/monitoring/grafana/provisioning/alerting/ go. An empty URL
      # fails alerting provisioning, so the default is a placeholder that only fails to send.
      GRAFANA_DISCORD_WEBHOOK_URL: ${GRAFANA_DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/0/not-set}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Provisioned on start: the Prometheus datasource and the "System evaluation" dashboard,
      # so a fresh Grafana (or a reset grafana-data volume) does not need the datasource added by
      # hand — see deploy/monitoring/README.md.
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  analyses:
  vectors:
  hf-cache:
  grafana-data:
  redis-data:
  phoenix-data:
