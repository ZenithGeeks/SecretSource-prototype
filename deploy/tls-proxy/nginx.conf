# Fixed target (gateway:8080, the compose service), unlike frontend/nginx.conf.template which
# is rendered for both compose and Cloud Run — this only ever runs in compose.
server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 100M;

    location / {
        # The gateway's own routes have no /api prefix (see backend/app/main.py) — only the
        # frontend's same-origin nginx proxy uses /api, to tell its own static files from
        # gateway calls. A client hitting this proxy directly (VITE_GATEWAY_URL) already knows
        # it's calling the gateway, so strip the prefix the same way frontend/nginx.conf.template
        # does, or every route 404s.
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # server-sent events must not be buffered or timed out
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
