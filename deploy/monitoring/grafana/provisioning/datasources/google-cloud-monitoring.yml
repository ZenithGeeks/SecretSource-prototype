apiVersion: 1

# Cloud Run services are private, so Prometheus cannot scrape them; their metrics come
# from Google Cloud Monitoring. The key file is prepared by ../../gcp-jwt-entrypoint.sh.
datasources:
  - name: Google Cloud Monitoring
    uid: gcp-cloud-monitoring
    type: stackdriver
    access: proxy
    editable: true
    jsonData:
      tokenUri: https://oauth2.googleapis.com/token
      clientEmail: 540627595710-compute@developer.gserviceaccount.com
      authenticationType: jwt
      defaultProject: gcp-edu-471706
      universeDomain: googleapis.com
      privateKeyPath: /tmp/gcp-service-account-private-key.pem
