global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  # Application metrics (success rate, queueing, verdicts, audit findings, LLM token usage):
  # app/metrics.py, exposed at GET /metrics on the gateway itself (backend/app/main.py).
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
