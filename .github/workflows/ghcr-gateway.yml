# Builds and pushes the gateway Docker image to GHCR on every push to main that touches
# backend/ runtime files. docker-host pulls this image for both gateway and worker.
name: ghcr-gateway

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/tests/**"
      - "!backend/**/*.md"
      - "!backend/pytest.ini"
      - "!backend/requirements-dev.txt"
      - ".github/workflows/ghcr-gateway.yml"
  workflow_dispatch:

concurrency:
  group: ghcr-gateway
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/zenithgeeks/secretsource-gateway:latest
            ghcr.io/zenithgeeks/secretsource-gateway:sha-${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
