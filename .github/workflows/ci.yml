# Runs on every PR and on main. Fast checks only: lint + typecheck + build.
# Docker images are not built here — the retrieval images pull multi-GB torch wheels,
# which is deploy-time work (see deploy.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push on the same PR or branch makes the previous run's results moot before it even
# finishes, so cancel it instead of burning minutes on an answer nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint
        run: ruff check backend services
      - name: Syntax check
        run: python -m compileall -q backend/app backend/cli.py services

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        run: npm run build
