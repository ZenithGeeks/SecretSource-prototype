# Runs on every PR and on main: lint, typecheck, build, and the backend unit tests.
# Docker images are not built here — the retrieval images pull multi-GB torch wheels,
# which is deploy-time work (see deploy.yml).
#
# On a PR, each job runs only when files it checks have changed (the `changes` job). A push to
# main runs every job. The runner is self-hosted, so pip and npm keep their caches on its disk,
# and the Python jobs keep their venvs there too, rebuilt only when the requirements change.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push on the same PR or branch makes the previous run's results moot before it even
# finishes, so cancel it instead of burning minutes on an answer nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [self-hosted, ci]
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
      backend: ${{ steps.paths.outputs.backend }}
      status_bot: ${{ steps.paths.outputs.status_bot }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      # A PR checks out its merge commit; its first parent is the base branch, so two commits
      # are enough to list what the PR changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            for job in python backend status_bot frontend; do echo "$job=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          # Each job's own files, plus this workflow. The backend tests also read
          # supabase/migrations and .env.cloud; ruff reads pyproject.toml.
          match() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          workflow='^\.github/workflows/ci\.yml$'
          echo "python=$(match "^(backend|services)/|^pyproject\.toml$|$workflow")" >> "$GITHUB_OUTPUT"
          echo "backend=$(match "^(backend|services/colbert|services/colpali|supabase)/|^(\.env\.cloud|pyproject\.toml)$|$workflow")" >> "$GITHUB_OUTPUT"
          echo "status_bot=$(match "^services/status-bot/|$workflow")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(match "^frontend/|$workflow")" >> "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: [self-hosted, ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint
        run: ruff check backend services
      - name: Syntax check
        run: python -m compileall -q backend/app backend/cli.py services

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, ci]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # No `cache: pip`: it downloaded a 1 GB pip cache from GitHub on every run (2.4 min),
      # while ~/.cache/pip already stays on this runner's disk.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same order as backend/Dockerfile: CPU torch first, so pip does not pull the multi-GB
      # CUDA build. NumPy <2.4 because this runner (ss-core) has no SSE4.2 and NumPy 2.4+
      # refuses to import there (app/native.py). The image apt-installs libGL for opencv; this
      # host has no libGL, so opencv-python is swapped for the headless build of the same
      # version, which is the same cv2 without the GUI libraries (skipped when only the headless
      # build was resolved).
      # The venv lives outside the workspace and is reused while the requirements, the Python
      # version, this recipe and the ISO week stay the same. The requirements are not pinned, so
      # the week makes it pick up new releases at least weekly, as a fresh install would. Change
      # RECIPE when you change the commands below, or the old venv is reused. The .complete
      # file marks a venv whose install finished.
      - name: Install
        env:
          RECIPE: backend-4
        run: |
          key=$({ cat requirements.txt requirements-dev.txt; python -VV; echo "$RECIPE"; date +%G-%V; } | sha256sum | cut -c1-16)
          venv="$HOME/ci-venvs/backend-$key"
          if [ ! -f "$venv/.complete" ]; then
            # nas-ci's /tmp is a 512 MB tmpfs and pip unpacks the torch wheel there, so a fresh
            # install ran out of space. Build on the runner's disk; the tests keep the tmpfs.
            export TMPDIR="$HOME/ci-tmp"
            rm -rf "$TMPDIR" && mkdir -p "$TMPDIR"
            rm -rf "$venv"
            python -m venv "$venv"
            "$venv/bin/pip" install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            # uv, not pip: pip backtracks for 40+ minutes on this set (see backend/Dockerfile).
            "$venv/bin/pip" install uv
            "$venv/bin/uv" pip install --python "$venv/bin/python" -r requirements-dev.txt "numpy<2.4"
            if "$venv/bin/pip" show opencv-python >/dev/null 2>&1; then
              version=$("$venv/bin/python" -c "import importlib.metadata as m; print(m.version('opencv-python'))")
              "$venv/bin/pip" uninstall -y opencv-python
              "$venv/bin/pip" install "opencv-python-headless==$version"
            fi
            # NLTK looks in <venv>/nltk_data, so app/text.py finds the Punkt model there.
            "$venv/bin/python" -m nltk.downloader -d "$venv/nltk_data" punkt_tab stopwords
            touch "$venv/.complete"
          fi
          # Each venv holds torch and is on the production host's disk: keep this one and the last.
          ls -dt "$HOME"/ci-venvs/backend-* | tail -n +3 | xargs -r rm -rf
          echo "VENV=$venv" >> "$GITHUB_ENV"
      # Unit tests only: tests/conftest.py replaces Redis. REDIS_URL points at a closed port, so
      # the real-Redis tests skip and never publish test analyses to production Redis, which
      # runs on this same machine. The retrieval services' server tests run in this venv too:
      # they fake the store, so they need FastAPI and mcp but no model. test_store.py fakes the
      # encoder as well and does exercise Store.search, including an empty paper list. It imports
      # the real store module, so ColBERT needs pypdf (the backend venv does not otherwise).
      # Each service runs from its own folder, because both have a server.py and a store.py.
      # The pipeline, labeling, researcher and gateway modules are at 100% statement and branch
      # coverage (#872); the gate keeps new code there. Other modules are not measured yet.
      - name: Test
        env:
          REDIS_URL: redis://127.0.0.1:1/0
        run: |
          "$VENV/bin/python" -m pytest -q --cov=app.pipeline --cov=app.labeling --cov=app.researcher \
            --cov=app.main --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=100
          (cd ../services/colbert && "$VENV/bin/python" -m pytest -q test_server*.py test_store.py)
          (cd ../services/colpali && "$VENV/bin/python" -m pytest -q test_server*.py test_store.py)

  status-bot-tests:
    needs: changes
    if: needs.changes.outputs.status_bot == 'true'
    runs-on: [self-hosted, ci]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/status-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No network in the tests: Grafana's answers are recorded fixtures, and Discord is faked.
      # The venv is reused the same way as backend-tests'.
      - name: Test
        env:
          RECIPE: status-bot-1
        run: |
          key=$({ cat requirements.txt requirements-dev.txt; python -VV; echo "$RECIPE"; date +%G-%V; } | sha256sum | cut -c1-16)
          venv="$HOME/ci-venvs/status-bot-$key"
          if [ ! -f "$venv/.complete" ]; then
            rm -rf "$venv"
            python -m venv "$venv"
            "$venv/bin/pip" install -r requirements-dev.txt
            touch "$venv/.complete"
          fi
          ls -dt "$HOME"/ci-venvs/status-bot-* | tail -n +3 | xargs -r rm -rf
          "$venv/bin/python" -m pytest -q

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, ci]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm`: ~/.npm stays on this runner's disk between runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        run: npm run build
      - name: Bundle size budget
        run: npm run check:bundle
      # The Vitest run fails below 100% coverage on the Researcher, Labeler and shared files
      # (vitest.config.ts). No frontend/.env exists here, so login stays off as the tests expect.
      - name: Test
        run: npm run test:legacy && npm run test:coverage
