# Deploys the stack to Cloud Run via deploy/cloudrun.sh.
#
# Manual trigger only: the vllm variant rents a GPU, and even the vertex variant builds
# and pushes several images. Run it from the Actions tab when a deploy is actually wanted.
#
# Required repository secrets:
#   GCP_SA_KEY        service-account JSON key with Cloud Run / Artifact Registry / Storage roles
#   GCP_PROJECT       project id
#   QDRANT_URL        Qdrant Cloud cluster URL
#   QDRANT_API_KEY    its API key
# Optional:
#   VLLM_API_KEY      keeps the same vLLM key across deploys (otherwise each deploy mints one)
#   HF_TOKEN          lifts Hugging Face's anonymous rate limit
name: deploy

on:
  workflow_dispatch:
    inputs:
      model:
        description: "LLM backend"
        type: choice
        options: [vertex, vllm]
        default: vertex
      region:
        description: "Cloud Run region"
        default: asia-southeast1

jobs:
  cloud-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          REGION: ${{ inputs.region }}
          MODEL: ${{ inputs.model }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./deploy/cloudrun.sh
