# Deploys frontend/ to Vercel on every push to main that touches it.
#
# Uses the Vercel CLI rather than Vercel's native GitHub integration: the repo is private and
# owned by an org, which the team's Vercel plan does not support for the native integration.
#
# The CLI hits a second version of the same restriction: Vercel's Hobby plan blocks any
# deployment whose commit author isn't a collaborator on the Vercel project ("The Hobby Plan
# does not support collaboration for private repositories") — but only when its CLI detects
# it's running inside GitHub Actions against a specific commit, via GITHUB_*/CI env vars, and
# looks up that commit's real author. A plain local `vercel deploy` with the identical commit,
# outside any CI, was never blocked. The job's `env:` block below blanks those vars for the
# Vercel steps so the CLI can't make that association, and this was verified experimentally: a
# commit authored by a nonexistent identity deployed straight to READY with the vars blanked,
# and was BLOCKED without them. No paid plan needed.
#
# Blanking the vars is not enough for a real teammate: the CLI also reads the commit author from
# the checkout's .git, and every teammate-authored commit hung at "Building…" anyway (#401). So
# the job deletes .git after checkout. Checked on 3d5ad37 (authored by a teammate) as a preview:
# with .git it hung until the step timed out, without .git it was READY in under a minute.
#
# That block on its own is recoverable (a re-run, or fixing the association, gets you a normal
# BLOCKED/ERROR state). What actually cost 6 hours three separate times (#203, #212, a retried
# #157) was `vercel deploy` hitting a still-blocked commit and hanging on an interactive
# confirmation instead of failing, silently eating the job until GitHub's 6-hour ceiling
# cancelled it. `--yes`/`--non-interactive` on build and deploy stop the prompt; `timeout-minutes: 2`
# on the deploy step is the backstop in case some other prompt shows up later — every real deploy
# so far has finished in about a minute, so 2 leaves headroom without eating much on a repeat.
#
# Required repository secrets:
#   VERCEL_TOKEN       from vercel.com/account/settings/tokens, scoped to this project
#   VERCEL_ORG_ID      the team id (starts with team_)
#   VERCEL_PROJECT_ID  the project id (starts with prj_)
#
# VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY / VITE_GATEWAY_URL are Vercel project env vars
# (Settings > Environment Variables), pulled in by `vercel pull` below.
name: deploy-frontend

on:
  push:
    branches: [main]
    # Tests and docs are not in the deployed build. Each run is billed GitHub-hosted minutes,
    # and the org's free plan has 2,000 a month (2,022 were used in September 2026).
    paths: ["frontend/**", "!frontend/tests/**", "!frontend/**/*.md"]
  workflow_dispatch:

# Only the latest push to main needs to actually deploy; a superseded run's minutes are wasted
# the moment a newer commit lands, so cancel it instead of letting it run to completion or timeout.
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Blanked so the Vercel CLI can't tell it's running in GitHub Actions against a specific
      # commit — see the header comment above for why.
      CI: ""
      GITHUB_ACTIONS: ""
      GITHUB_SHA: ""
      GITHUB_REF: ""
      GITHUB_REPOSITORY: ""
      GITHUB_ACTOR: ""
      GITHUB_EVENT_NAME: ""
    steps:
      - uses: actions/checkout@v4
      - name: Remove .git so the Vercel CLI cannot read the commit author
        run: rm -rf ../.git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Vercel project settings and env vars
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (Vercel-driven, uses pulled env vars)
        run: npx vercel build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt output
        timeout-minutes: 2
        run: npx vercel deploy --prebuilt --prod --yes --non-interactive --token=${{ secrets.VERCEL_TOKEN }}
