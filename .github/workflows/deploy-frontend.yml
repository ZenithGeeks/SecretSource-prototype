# Deploys frontend/ to Vercel on every push to main that touches it.
#
# Uses the Vercel CLI rather than Vercel's native GitHub integration: the repo is private and
# owned by an org, which the team's Vercel plan does not support for the native integration.
#
# The CLI mostly sidesteps that, but not entirely: Vercel's Hobby plan also blocks any
# deployment — CLI included — whose commit author isn't a collaborator on the Vercel project
# itself ("The Hobby Plan does not support collaboration for private repositories"). Since this
# Vercel project lives under a personal account, a push authored by anyone other than that
# account's owner will leave this workflow's run BLOCKED indefinitely at the deploy step (it
# does not fail fast — cancel it manually: `gh run cancel <run-id>`).
#
# When that happens, the account owner deploys manually from a local checkout instead:
#   cd frontend
#   npx vercel pull --yes --environment=production --token=<VERCEL_TOKEN>
#   npx vercel build --prod --token=<VERCEL_TOKEN>
#   npx vercel deploy --prebuilt --prod --token=<VERCEL_TOKEN>
# This attributes the deploy to the owner's own local git identity, not the original commit
# author, so it isn't blocked. Fixing this for real means upgrading the Vercel team to Pro.
#
# Required repository secrets:
#   VERCEL_TOKEN       from vercel.com/account/settings/tokens, scoped to this project
#   VERCEL_ORG_ID      the team id (starts with team_)
#   VERCEL_PROJECT_ID  the project id (starts with prj_)
#
# VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY / VITE_GATEWAY_URL are Vercel project env vars
# (Settings > Environment Variables), pulled in by `vercel pull` below.
name: deploy-frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

jobs:
  vercel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # EXPERIMENT: blank these so the Vercel CLI can't tell it's running in GitHub Actions
      # against a specific commit, testing whether that's what triggers its commit-author check.
      CI: ""
      GITHUB_ACTIONS: ""
      GITHUB_SHA: ""
      GITHUB_REF: ""
      GITHUB_REPOSITORY: ""
      GITHUB_ACTOR: ""
      GITHUB_EVENT_NAME: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Vercel project settings and env vars
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (Vercel-driven, uses pulled env vars)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt output
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
