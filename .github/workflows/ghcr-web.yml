# Builds and pushes the web Docker image to GHCR on every push to main that touches
# frontend/ runtime files. docker-host pulls this image automatically.
name: ghcr-web

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "!frontend/tests/**"
      - "!frontend/**/*.md"
      - ".github/workflows/ghcr-web.yml"
  workflow_dispatch:

concurrency:
  group: ghcr-web
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/zenithgeeks/secretsource-web:latest
            ghcr.io/zenithgeeks/secretsource-web:sha-${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_TEACHER_BACKEND=${{ vars.VITE_TEACHER_BACKEND || 'remote' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
